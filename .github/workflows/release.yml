name: Build release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip
          sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua5.4 100
          sudo update-alternatives --install /usr/bin/luac luac /usr/bin/luac5.4 100

      - name: Run checks
        run: make check

      - name: Build packages
        run: make package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koreader-git-sync-packages
          path: |
            dist/koreader-git-sync.koplugin.zip
            dist/koreader-git-sync.koplugin.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            dist/koreader-git-sync.koplugin.zip
            dist/koreader-git-sync.koplugin.tar.gz
