name: Build release packages

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 zip
          sudo update-alternatives --install /usr/bin/lua lua /usr/bin/lua5.4 100
          sudo update-alternatives --install /usr/bin/luac luac /usr/bin/luac5.4 100

      - name: Run checks
        run: make check

      - name: Build packages
        run: make package

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: koreader-git-sync-packages
          path: |
            dist/koreader-git-sync.koplugin.zip
            dist/koreader-git-sync.koplugin.tar.gz

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --title "KOReader Git Sync ${TAG_NAME}"
            --notes "Automated build for KOReader Git Sync ${TAG_NAME}."
          )

          if [[ "$TAG_NAME" == "0.1.0" || "$TAG_NAME" == *"-rc"* ]]; then
            release_args+=(--prerelease)
          fi

          assets=(
            dist/koreader-git-sync.koplugin.zip
            dist/koreader-git-sync.koplugin.tar.gz
          )

          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" "${assets[@]}" "${release_args[@]}"
          fi
